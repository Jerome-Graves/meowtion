name: tests

on:
  push:
  pull_request:

jobs:
  python:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest pytest-cov pandas numpy
      - name: Run pytest with coverage
        run: >
          python -m pytest app/dashboard/tests app/firebase/functions/tests -v
          --cov --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: coverage.xml
          fail_ci_if_error: false      # never fail the build on a coverage-upload hiccup
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  firmware:
    name: Collar logic unit tests (C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Build and run host C tests
        run: make -C firmware/test check
