name: tests

on:
  push:
  pull_request:

jobs:
  python:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest pytest-cov pandas numpy
      - name: Run pytest with coverage
        run: >
          python -m pytest app/dashboard/tests app/firebase/functions/tests -v
          --cov --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: false      # never fail the build on a coverage-upload hiccup
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  firmware:
    name: Collar logic unit tests (C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and run host C tests
        run: make -C firmware/test check
